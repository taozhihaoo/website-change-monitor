name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Covers src/, test/, scripts/ and the client workspace.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (offline, local fixtures)
        run: npm run test:integration

      - name: Build
        run: npm run build

      # Exercises the real compiled server (dist/index.js) over HTTP against
      # a local fixture site: change semantics, webhook delivery, retention,
      # pagination and clean error envelopes. Runs once, on the newest Node.
      - name: End-to-end verification (built server)
        if: matrix.node == 24
        run: node scripts/e2e-verify.mjs
