<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Self-hosted website change monitor: Playwright extraction, SQLite history, scheduled checks, webhook and email notifications."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='none' stroke='white' stroke-opacity='.65' stroke-width='1.6'/%3E%3Cpath d='M16 16 22.6 9.4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='10' r='2' fill='white'/%3E%3C/svg%3E"
    />
    <title>Website Change Monitor</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong colour scheme.
      (function () {
        try {
          var stored = localStorage.getItem('wcm.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (theme === null) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
